<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="욕망의 칼 (가제) — 웹 리더">
  <meta name="robots" content="noindex, nofollow">
  <title>욕망의 칼 (가제)</title>
  <link rel="icon" type="image/svg+xml" href="scenaverse/favicon.svg">
  <link rel="stylesheet" href="scenaverse/style.css">
</head>
<body data-view="reader">
  <!-- 접근 게이트 (가벼운 접근 제한 — 정식 인증 아님) -->
  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <form class="gate__box" id="gateForm" autocomplete="off">
      <h1 class="gate__title" id="gateTitle">욕망의 칼</h1>
      <p class="gate__desc">기획서·트리트먼트는 비밀번호가 필요합니다.</p>
      <input
        class="gate__input"
        id="gateInput"
        type="password"
        inputmode="text"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="비밀번호"
        placeholder="비밀번호"
      />
      <button type="submit" class="gate__btn">입장</button>
      <p class="gate__error" id="gateError" role="alert" aria-live="assertive"></p>
    </form>
  </div>

  <!-- 상단 내비게이션 (3탭: 기획서 / 트리트먼트 / 시나리오) — 신규 -->
  <nav class="site-nav" aria-label="주 메뉴">
    <div class="site-nav__inner">
      <a class="site-nav__tab" data-tab="deck" href="?view=deck">기획서</a>
      <a class="site-nav__tab" data-tab="treatment" href="?view=treatment">트리트먼트</a>
      <a class="site-nav__tab" data-tab="reader" href="?view=reader&ep=1">시나리오</a>
    </div>
  </nav>

  <header class="site-header">
    <h1 class="site-title">욕망의 칼</h1>
    <p class="site-subtitle">각본 · 감독 로고스</p>
  </header>

  <main class="site-main">
    <!-- 시나리오 리더 (기존 화별 리더 — 세로 스크롤 + 순차 잠금 + ?ep=N) -->
    <div id="view-reader">
      <section class="reader" id="reader" aria-live="polite">
        <header class="reader__head">
          <p class="reader__epno" id="epno"></p>
          <h2 class="reader__eptitle" id="eptitle"></h2>
        </header>

        <div class="reader__body" id="episode"></div>

        <div class="reader__sentinel" id="sentinel" aria-hidden="true"></div>
      </section>
    </div>

    <!-- 트리트먼트 (임시 구현 — 단순 세로 스크롤 마크다운) -->
    <div id="view-treatment">
      <section class="treatment">
        <p class="treatment__note">
          임시 화면입니다. 트리트먼트 전용 뷰어의 정식 기획은 추후 제공될 예정이며,
          현재는 트리트먼트(V3) 원문을 그대로 렌더링해 보여줍니다.
        </p>
        <div class="md" id="treatmentBody"></div>
      </section>
    </div>
  </main>

  <!-- 기획서 뷰어 (풀스크린 좌우 페이지 넘김 — deck.js 가 내부를 구성) -->
  <section class="deck" id="view-deck" aria-label="기획서"></section>

  <footer class="site-footer">
    <small>&copy; 2026 MereCinema. All rights reserved.</small>
  </footer>

  <button type="button" class="next-fab is-locked" id="nextFab" aria-label="다음 화">
    <span class="next-fab__icon" id="nextFabIcon">&#128274;</span>
    <span class="next-fab__label" id="nextFabLabel">다음 화</span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 접근 게이트 로직 (세션 동안 유지) -->
  <script>
    (function () {
      var GATE_PASS = "9771";
      var GATE_KEY = "kod_gate_ok";
      var gate = document.getElementById("gate");
      var form = document.getElementById("gateForm");
      var input = document.getElementById("gateInput");
      var errorEl = document.getElementById("gateError");

      function pass() {
        try { sessionStorage.setItem(GATE_KEY, "1"); } catch (e) {}
        gate.classList.add("is-hidden");
        document.body.classList.remove("is-gated");
        window.setTimeout(function () {
          if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
        }, 300);
      }

      // 시나리오 리더(?view=reader)는 게이트 없이 공개 — 기획서·트리트먼트만 비밀번호 필요
      var isReaderView = new URLSearchParams(window.location.search).get("view") === "reader";

      var already = false;
      try { already = sessionStorage.getItem(GATE_KEY) === "1"; } catch (e) {}

      if (isReaderView || already) {
        gate.classList.add("is-hidden");
        if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
      } else {
        document.body.classList.add("is-gated");
        input.focus();
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (input.value === GATE_PASS) {
            errorEl.textContent = "";
            pass();
          } else {
            errorEl.textContent = "비밀번호가 틀렸습니다.";
            input.value = "";
            input.focus();
          }
        });
      }
    })();
  </script>

  <!-- 클라이언트 라우터 (신규): ?view 로 뷰 결정. 게이트는 사이트 전체에 한 번만 적용됨. -->
  <script>
    (function () {
      var v = new URLSearchParams(window.location.search).get("view");
      // 기본 진입 뷰: 기획서(deck). 시나리오 리더는 탭 클릭(?view=reader)으로만 진입.
      if (v !== "treatment" && v !== "reader") v = "deck";
      document.body.setAttribute("data-view", v);
    })();
  </script>

  <!-- 시나리오 리더 (기존) -->
  <script src="scenaverse/content.js"></script>
  <script src="scenaverse/main.js"></script>

  <!-- 트리트먼트 (임시) -->
  <script src="scenaverse/treatment-content.js"></script>
  <script src="scenaverse/treatment.js"></script>

  <!-- 기획서 뷰어 (신규 넘김 패턴) -->
  <script src="scenaverse/deck.js"></script>
</body>
</html>
